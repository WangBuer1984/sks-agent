server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sks}
    username: ${SPRING_DATASOURCE_USERNAME:sks}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.sks: INFO
    org.springframework.security: INFO

sks:
  trial-credit: ${TRIAL_CREDIT:3}
  # Java→Python 内网调用（AiClient 基座用）：base-url 在 docker 内是 http://sks-ai:8000，
  # 本地 dev 可用 http://localhost:8000；service-token 来自 .env SERVICE_TOKEN（Python verify_service_token 校验同值）。
  ai:
    base-url: ${SKS_AI_BASE_URL:http://sks-ai:8000}
  service-token: ${SERVICE_TOKEN:}
