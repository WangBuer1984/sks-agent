services:
  postgres:
    # Docker Hub 国内不可达；钉 DaoCloud 公共镜像（与官方 pgvector/pgvector:pg16 同内容）
    image: docker.m.daocloud.io/pgvector/pgvector:pg16
    container_name: sks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - sks-pgdata:/var/lib/postgresql/data
    networks:
      - sks-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  sks-server:
    image: ${SKS_IMAGE_REGISTRY:-ghcr.io/wangbuer1984}/sks-server:v0.1.1
    container_name: sks-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 激活 prod profile（加载 application-prod.yml）——env 优先级高于镜像内 application.yml 的 local 默认。
      SPRING_PROFILES_ACTIVE: prod
      # 数据源（容器内网主机名 postgres）
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sks-net
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sks-ai:
    image: ${SKS_IMAGE_REGISTRY:-ghcr.io/wangbuer1984}/sks-ai:v0.1.1
    container_name: sks-ai
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY}
      TIKHUB_API_KEY: ${TIKHUB_API_KEY}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET}
    depends_on:
      sks-server:
        condition: service_healthy
    networks:
      - sks-net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  sks-web:
    image: ${SKS_IMAGE_REGISTRY:-ghcr.io/wangbuer1984}/sks-web:v0.1.2
    container_name: sks-web
    restart: unless-stopped
    networks:
      - sks-net
    expose:
      - "80"
    healthcheck:
      # alpine/busybox wget 没有 --spider；用 127.0.0.1 避免 localhost 走 IPv6
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    container_name: sks-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      sks-server:
        condition: service_healthy
      sks-web:
        condition: service_healthy
    networks:
      - sks-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/50x.html || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  sks-net:
    driver: bridge

volumes:
  sks-pgdata:
