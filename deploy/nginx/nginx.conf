server {
    listen 80;
    server_name _;

    # ── 容器名按请求解析（不加这行 + 下面 proxy_pass 里的变量，独立部署就是假的）──────────
    # nginx 对 proxy_pass 里写死的主机名只在启动时解析一次并永久缓存。sks-server / sks-web
    # 单独重启（正是「三服务各自独立部署」的常规操作）会拿到新 IP，网关却还往旧 IP 发，
    # 结果是持续 502，且只有重启/reload 网关才能恢复——等于每次发单个服务都要连带动网关。
    # 127.0.0.11 是 Docker 内嵌 DNS，仅在 user-defined network 上可用（sks-net 是，默认 bridge 不是）。
    # valid=10s 覆盖 Docker DNS 的长 TTL，换 IP 后 10s 内自愈；ipv6=off 免去容器名无 AAAA 记录时的无谓解析。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 50x 兜底页（PRD §11.6 文案）——error_page 内部重定向到该静态页，
    # 即使 Java/Python 全挂仍能渲染（无外部依赖，纯内联 CSS）。
    # 上线前：sed/envsubst 替换 50x.html 中的 {{CONTACT_WECHAT}}（见 deploy/OPS.md）。
    error_page 500 502 503 504 /50x.html;
    # 不加 internal：brief 验收要求 `curl https://域名/50x.html` 可直访兜底页。
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # 反代 Java（唯一公网入口）。
    # §5.3 全链路超时「内层短于外层」：Python 内 LLM 单次 120s × 最多 2（原始+1 重试）= 240s
    # → Java AiClient read-timeout 270s → nginx 300s。nginx 不可短于 Java，否则会先掐断仍在跑的
    # Python 调用 → 假 AI_FAILED → 误退款（设计文档 §5.3）。P0 原为 90s，P5 对齐为 300s。
    location /api/ {
        # 变量是「按请求解析」的开关（见上 resolver）。$request_uri 不是可选的修饰——
        # nginx 规则：proxy_pass 里一旦出现变量，指令中若还写死 URI（原来那个尾巴 /api/），
        # 那段会被【原样】发给上游、替换掉真实请求 URI，即 /api/works/1 全变成 /api/，
        # API 静默全废且 nginx 不报任何错。故显式用 $request_uri 传原始 URI。
        # 与改造前等价：原写法是把 location 前缀 /api/ 替换成 /api/，本就是空操作。
        set $api_upstream sks-server:8080;
        proxy_pass http://$api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 静态不再本地 serve —— 反代 sks-web 容器（try_files fallback 在 sks-web 内）
    location / {
        # 同上：变量 + $request_uri。原写法无 URI 尾巴、本就透传完整 URI，行为一致。
        set $web_upstream sks-web:80;
        proxy_pass http://$web_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

