server {
    listen 80;
    server_name _;

    # SPA 静态产物
    root /usr/share/nginx/html;
    index index.html;

    # 50x 兜底页（PRD §11.6 文案）——error_page 内部重定向到该静态页，
    # 即使 Java/Python 全挂仍能渲染（无外部依赖，纯内联 CSS）。
    # 上线前：sed/envsubst 替换 50x.html 中的 {{CONTACT_WECHAT}}（见 deploy/OPS.md）。
    error_page 500 502 503 504 /50x.html;
    # 不加 internal：brief 验收要求 `curl https://域名/50x.html` 可直访兜底页。
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # 反代 Java（唯一公网入口）。
    # §5.3 全链路超时「内层短于外层」：Python 内 LLM 单次 120s × 最多 2（原始+1 重试）≈ 250s
    # → Java AiClient read-timeout 270s → nginx 300s。nginx 不可短于 Java，否则会先掐断仍在跑的
    # Python 调用 → 假 AI_FAILED → 误退款（设计文档 §5.3）。P0 原为 90s，P5 对齐为 300s。
    location /api/ {
        proxy_pass http://sks-server:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ──────────────────────────────────────────────────────────────────────────────
# HTTPS（certbot / Let's Encrypt）——本地/联调无真实域名时保持 80-only，
# 上线前按 deploy/OPS.md 步骤签发证书后取消注释（或用 nginx.https.conf.example 覆盖）。
# 注意：启用 443 块时，把上面的 `listen 80; server_name _;` 块改为 80→443 跳转
# （return 301 https://$host$request_uri;），避免 80/443 两块都监听 _。
