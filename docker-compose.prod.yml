# ── 生产 HTTPS override ─────────────────────────────────────────────────────────
# 用法：docker compose -f docker-compose.yml -f docker-compose.prod.yml <cmd>
#   （本地联调不用此文件——本地走 80-only 的 docker-compose.yml + .override 暴露 pg 5432）
#
# 做三件事：
#   1. nginx 用 nginx.https.conf 构建（build arg）——Dockerfile ARG NGINX_CONF 默认 nginx.conf，
#      prod 改成 nginx.https.conf（443 + 80→443 跳转）。配合先 sed 替换域名。
#   2. 挂 /etc/letsencrypt 只读卷——certbot 在宿主签发的证书由此挂入容器，nginx 读得到。
#   3. 开 443 端口——base compose 只开了 80（本地 80-only 够用）；ports 是合并去重，80 仍在。
#
# 前置：certbot 必须先签发证书到 /etc/letsencrypt/live/<域名>/，否则 nginx -t 起不来。
# 顺序见 deploy/OPS.md「上线 certbot」段。
services:
  nginx:
    build:
      args:
        NGINX_CONF: nginx.https.conf
    ports:
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
